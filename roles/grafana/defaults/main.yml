---
grafana_version: latest
grafana_manage_repo: true

# Offline installation of the Grafana package itself. When enabled, Grafana is
# installed from a local .deb (Debian/Ubuntu) or .rpm (RHEL, Fedora, openSUSE)
# package instead of the configured repository.
grafana_offline_package_install: false
# Path to the Grafana package on the Ansible control node. When
# grafana_offline_package_download is true this is the download destination; when
# empty, the package is cached in grafana_offline_cache_dir.
grafana_offline_package_path: ""
# Download the Grafana package on the Ansible control node before installing it.
grafana_offline_package_download: false
# URL used to download the Grafana package. When empty, it is derived from
# grafana_version and the target package manager.
grafana_offline_package_url: ""
# Optional checksum for the downloaded package, e.g. "sha256:...".
grafana_offline_package_checksum: ""
# Verify the GPG signature of the local package. Disable only when the artifact
# is trusted out-of-band and the host does not already trust the Grafana key.
grafana_offline_package_gpg_check: true
# Allow installing an older Grafana package version (rollbacks).
grafana_offline_package_allow_downgrade: false

# Offline installation of Grafana plugins. When enabled, plugins are installed
# from local ZIP archives instead of being fetched by grafana-cli on the managed
# host. The archives can be provided locally or downloaded on the control node.
grafana_offline_plugins_install: false
# Directory on the Ansible control node containing local <plugin-name>.zip
# archives. Downloaded pinned versions are stored as <plugin-name>-<version>.zip.
# When empty and grafana_offline_plugins_download is true, archives are cached in
# {{ grafana_offline_cache_dir }}/plugins.
grafana_offline_plugins_dir: ""
# Download plugin archives on the Ansible control node before installing them.
grafana_offline_plugins_download: false
# Base URL used to download plugin archives.
grafana_offline_plugins_url: "https://grafana.com/api/plugins"
# Optional plugin version pins, e.g. {grafana-clock-panel: "3.2.5"}.
grafana_offline_plugins_versions: {}
# Optional plugin archive checksums keyed by plugin id, e.g.
# {grafana-clock-panel: "sha256:..."}.
grafana_offline_plugins_checksums: {}
# Reinstall offline plugins even when their directory already exists.
grafana_offline_plugins_force: false

# Cache directory on the Ansible control node for downloaded artifacts.
grafana_offline_cache_dir: "{{ lookup('env', 'HOME') | default('/tmp', true) }}/.cache/grafana-offline"
# Staging directory on the managed host, used while installing.
grafana_offline_staging_dir: "/var/tmp/grafana-offline"
# Force re-download of artifacts on the control node. Artifacts tracking
# "latest" are always refreshed regardless of this setting.
grafana_offline_download_force: false

# Proxy settings used when downloading artifacts on the control node. They
# default to the http_proxy/https_proxy/no_proxy environment variables of the
# controller and can be overridden explicitly.
grafana_offline_http_proxy: "{{ lookup('env', 'http_proxy') or lookup('env', 'HTTP_PROXY') }}"
grafana_offline_https_proxy: "{{ lookup('env', 'https_proxy') or lookup('env', 'HTTPS_PROXY') }}"
grafana_offline_no_proxy: "{{ lookup('env', 'no_proxy') or lookup('env', 'NO_PROXY') }}"

# Internal derived values. They are lazy defaults so any task can consume them
# without depending on preflight having run first.
# Repository management is skipped when the Grafana package is installed offline.
_grafana_manage_repo: "{{ grafana_manage_repo | bool and not (grafana_offline_package_install | bool) }}"
_grafana_offline_package_url: >-
  {{ grafana_offline_package_url
     or ('https://dl.grafana.com/oss/release/grafana_' ~ grafana_version ~ '_' ~ grafana_apt_arch ~ '.deb'
         if ansible_facts['pkg_mgr'] == 'apt'
         else 'https://dl.grafana.com/oss/release/grafana-' ~ grafana_version ~ '-1.' ~ ansible_facts['architecture'] ~ '.rpm') }}
_grafana_offline_package_dest: >-
  {{ grafana_offline_package_path
     if grafana_offline_package_path | length > 0
     else (grafana_offline_cache_dir ~ '/' ~ (_grafana_offline_package_url | basename)) }}
_grafana_offline_plugins_dir: >-
  {{ grafana_offline_plugins_dir
     if grafana_offline_plugins_dir | length > 0
     else (grafana_offline_cache_dir ~ '/plugins') }}
_grafana_offline_download_environment: >-
  {{ {'http_proxy': grafana_offline_http_proxy,
      'https_proxy': grafana_offline_https_proxy,
      'no_proxy': grafana_offline_no_proxy}
     | dict2items | rejectattr('value', 'equalto', '') | items2dict }}

grafana_yum_repo: "https://rpm.grafana.com"
grafana_yum_key: "https://rpm.grafana.com/gpg.key"

grafana_rhsm_subscription: ""
grafana_rhsm_repo: ""

grafana_apt_release_channel: stable
grafana_apt_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
grafana_apt_repo_uri: "https://apt.grafana.com/"
grafana_apt_repo: "deb [arch={{ grafana_apt_arch }} signed-by=/usr/share/keyrings/grafana.asc] {{ grafana_apt_repo_uri }} {{ grafana_apt_release_channel }} main"
grafana_apt_key: "https://apt.grafana.com/gpg.key"
grafana_apt_name: "grafana"

# Should we use the provisioning capability when possible (provisioning require grafana >= 5.0)
grafana_use_provisioning: true

# Should the provisioning be kept synced. If true, previous provisioned objects will be removed if not referenced anymore.
grafana_provisioning_synced: false

# Should we provision dashboards by following the files structure. This sets the foldersFromFilesStructure option
grafana_provisioning_dashboards_from_file_structure: false

# To enable the use of ports below 1024 for unprivileged processes linux needs to set CAP_NET_BIND_SERVICE.
# This has some security implications, and should be a conscious choice.
# Get informed by reading: http://man7.org/linux/man-pages/man7/capabilities.7.html
grafana_cap_net_bind_service: false

grafana_ini_default:
  instance_name: "{{ ansible_facts['fqdn'] | default(ansible_host) | default(inventory_hostname) }}"

  paths:
    logs: "/var/log/grafana"
    data: "/var/lib/grafana"

  server:
    http_addr: "0.0.0.0"
    http_port: 3000
    # External Grafana address. Variable maps to "root_url" in grafana server section
    #root_url: "http://{{ grafana_ini.server.http_addr }}:{{ grafana_ini.server.http_port }}"
    domain: "{{ ansible_facts['fqdn'] | default(ansible_host) | default('localhost') }}"

    # Additional options for grafana "server" section
    # This section WILL omit options for: http_addr, http_port, domain, and root_url, as those settings are set by variables listed before
    protocol: http
    enforce_domain: false
    socket: ""
    cert_key: ""
    cert_file: ""
    enable_gzip: false
    static_root_path: public
    router_logging: false
    serve_from_sub_path: false

  # Variables correspond to ones in grafana.ini configuration file
  # Security
  security:
    admin_user: admin
    admin_password: ""
    # secret_key: ""
    # login_remember_days: 7
    # cookie_username: grafana_user
    # cookie_remember_name: grafana_remember
    # disable_gravatar: true
    # data_source_proxy_whitelist:

  # Database setup
  database:
    type: sqlite3
    # host: 127.0.0.1:3306
    # name: grafana
    # user: root
    # password: ""
    # url: ""
    # ssl_mode: disable
    # path: grafana.db
    # max_idle_conn: 2
    # max_open_conn: ""
    # log_queries: ""

  # User management and registration
  users:
    allow_sign_up: false
    # allow_org_create: true
    # auto_assign_org: true
    auto_assign_org_role: Viewer
    # login_hint: "email or username"
    default_theme: dark
    # external_manage_link_url: ""
    # external_manage_link_name: ""
    # external_manage_info: ""

  # grafana authentication mechanisms
  auth: {}
  #  disable_login_form: false
  #  oauth_auto_login: false
  #  disable_signout_menu: false
  #  signout_redirect_url: ""
  #  anonymous:
  #    org_name: "Main Organization"
  #    org_role: Viewer
  #  ldap:
  #    config_file: "/etc/grafana/ldap.toml"
  #    allow_sign_up: false
  #  basic:
  #    enabled: true


grafana_api_url: "{{ grafana_ini.server.root_url }}"

