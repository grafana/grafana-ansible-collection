---
- name: APT - Install Alloy from remote URL
  ansible.builtin.apt:
    deb: "{{ alloy_download_url_deb }}"
    state: present
  notify: restart alloy
  when:
    - alloy_install_method == "url"
    - __current_deployed_version.stdout is not defined or alloy_version not in __current_deployed_version.stdout

- name: APT - Install Alloy from Grafana apt repository
  when: alloy_install_method == "repo"
  block:
    - name: "Install dependencies"
      ansible.builtin.apt:
        name: python3-debian
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: "Add Grafana apt repository"
      ansible.builtin.deb822_repository:
        name: "{{ alloy_apt_name }}"
        types: deb
        uris: "{{ alloy_apt_repo_uri }}"
        suites: "{{ alloy_apt_release_channel }}"
        components:
          - main
        architectures:
          - "{{ alloy_apt_arch }}"
        signed_by: "{{ alloy_apt_key }}"
      register: __alloy_apt_repo

    - name: "Update apt cache"
      ansible.builtin.apt:
        update_cache: true
      when: __alloy_apt_repo is changed

    - name: APT - Install Alloy
      ansible.builtin.apt:
        name: alloy
        state: present
      notify: restart alloy
