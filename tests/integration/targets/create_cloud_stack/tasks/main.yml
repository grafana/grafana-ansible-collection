---
- name: Create a Grafana Cloud stack
  grafana.grafana.cloud_stack:
    name: "{{ test_stack_name }}"
    stack_slug: "{{ test_stack_name }}"
    cloud_api_key: "{{ grafana_cloud_api_key }}"
    org_slug: "{{ org_name }}"
    state: present
    region: eu
    delete_protection: false
  register: create_result

- name: Create Check
  ansible.builtin.assert:
    that:
      - create_result.url == "https://" + "{{ test_stack_name }}" + ".grafana.net"
      - create_result.otlp_url is match("https://otlp-gateway-")
      - create_result.prometheus_private_connectivity_info_private_dns is defined
      - create_result.fleet_management_private_connectivity_info_regions is iterable

- name: Sleep for 45 seconds
  ansible.builtin.wait_for:
    timeout: 45
