---
- name: Set Notification policy tree
  grafana.grafana.alert_notification_policy:
    grafana_url: "{{ grafana_url }}"
    grafana_api_key: "{{ grafana_api_key }}"
    routes: [{receiver: empty, object_matchers: [["env", "=", "Production"]]}]
  register: result

- assert:
    that:
      - result.failed == false
