---
name: Modules Test

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - "main"
  pull_request:
  schedule:
    - cron: "0 6 * * *"
env:
  NAMESPACE: grafana
  COLLECTION_NAME: grafana

permissions:
  contents: read

jobs:
  sanity:
    name: Sanity (Ⓐ${{ matrix.ansible }})
    strategy:
      matrix:
        ansible:
          - stable-2.12
          - stable-2.13
          - stable-2.14
          - devel
    runs-on: ubuntu-20.04
    steps:
      - name: Check out code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          path: ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Install ansible-base (${{ matrix.ansible }})
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz --disable-pip-version-check

      - name: Run sanity tests
        run: ansible-test sanity -v --docker --color --coverage
        working-directory: ./ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}

  integration:
    runs-on: ubuntu-20.04
    name: Integration (Ⓐ${{ matrix.ansible }}-py${{ matrix.python }})
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        ansible:
          - stable-2.13
        python:
          - "3.10"

    steps:
      - name: Check out code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          path: ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}
          persist-credentials: false

      - name: Get secrets
        id: secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@2f1ddaf3ce1aa677356243d0dd584be33cfa35e3 # get-vault-secrets/v2.1
        with:
          repo_secrets: |
            ANSIBLE_TEST_CLOUD_API_KEY_KEY=grafana-com:access-token
            ANSIBLE_TEST_GRAFANA_API_KEY=grafana-serviceaccount:token

      - name: create integration_config
        working-directory: ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}/tests/integration
        env:
          ANSIBLE_TEST_CLOUD_API_KEY: ${{ fromJSON(steps.secrets.outputs.secrets || '{}').ANSIBLE_TEST_CLOUD_API_KEY }}
          ANSIBLE_TEST_GRAFANA_API_KEY: ${{ fromJSON(steps.secrets.outputs.secrets || '{}').ANSIBLE_TEST_GRAFANA_API_KEY }}
          ANSIBLE_TEST_ORG_NAME: ${{ variables.ANSIBLE_TEST_ORG_NAME }}
          ANSIBLE_TEST_STACK_NAME: ${{ variables.ANSIBLE_TEST_STACK_NAME }}
          ANSIBLE_GRAFANA_URL: ${{ variables.ANSIBLE_GRAFANA_URL }}
        run: |
          cat <<EOF > integration_config.yml
          org_name: ${ ANSIBLE_TEST_ORG_NAME }
          grafana_cloud_api_key: ${ ANSIBLE_TEST_CLOUD_API_KEY }
          grafana_api_key: ${ ANSIBLE_TEST_GRAFANA_API_KEY }
          grafana_url: ${ ANSIBLE_GRAFANA_URL }
          test_stack_name: ${ ANSIBLE_TEST_STACK_NAME }
          EOF

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-base (${{ matrix.ansible }})
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz --disable-pip-version-check

      - name: Install Requests
        run: pip install requests

      - name: Create Test Stack
        run: ansible-test integration -v create_cloud_stack --color --retry-on-error --continue-on-error --diff --python ${{ matrix.python }} --coverage --docker
        working-directory: ./ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}

      - name: Test Modules
        run: ansible-test integration -v alert_contact_point alert_notification_policy cloud_api_key cloud_plugin dashboard datasource folder --color --retry-on-error --continue-on-error --diff --python ${{ matrix.python }} --coverage --docker
        working-directory: ./ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}

      - name: Delete Test Stack
        if: success() || failure()
        run: ansible-test integration -v delete_cloud_stack --color --retry-on-error --continue-on-error --diff --python ${{ matrix.python }} --coverage --docker
        working-directory: ./ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}
