---
name: Full Integration Test

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
env:
  NAMESPACE: grafana
  COLLECTION_NAME: grafana

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    name: ${{ matrix.ansible }}-py${{ matrix.python }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        ansible:
          - stable-2.20
          - stable-2.21
          - stable-2.22
          - devel
        python:
          - "3.13"
          - "3.14"
          - "3.15"
        exclude:
          - ansible: stable-2.20
            python: "3.15"
    steps:
      - name: Check out code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e  # v2.8.0
        with:
          path: ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}
          persist-credentials: false

      - name: Get secrets
        id: secrets
        uses: grafana/shared-workflows/actions/get-vault-secrets@2f1ddaf3ce1aa677356243d0dd584be33cfa35e3  # get-vault-secrets/v2.1
        with:
          repo_secrets: |
            ANSIBLE_TEST_CLOUD_API_KEY=grafana-com:access-token
            ANSIBLE_TEST_GRAFANA_API_KEY=grafana-serviceaccount:token

      - name: create integration_config
        working-directory: ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}/tests/integration
        env:
          ANSIBLE_TEST_CLOUD_API_KEY: ${{ fromJSON(steps.secrets.outputs.secrets || '{}').ANSIBLE_TEST_CLOUD_API_KEY }}
          ANSIBLE_TEST_GRAFANA_API_KEY: ${{ fromJSON(steps.secrets.outputs.secrets || '{}').ANSIBLE_TEST_GRAFANA_API_KEY }}
          ANSIBLE_TEST_ORG_NAME: ${{ vars.ANSIBLE_TEST_ORG_NAME }}
          ANSIBLE_TEST_STACK_NAME: ${{ vars.ANSIBLE_TEST_STACK_NAME }}
          ANSIBLE_GRAFANA_URL: ${{ vars.ANSIBLE_GRAFANA_URL }}
        run: |
          cat <<EOF > integration_config.yml
          org_name: ${ANSIBLE_TEST_ORG_NAME}
          grafana_cloud_api_key: ${ANSIBLE_TEST_CLOUD_API_KEY}
          grafana_api_key: ${ANSIBLE_TEST_GRAFANA_API_KEY}
          grafana_url: ${ANSIBLE_GRAFANA_URL}
          test_stack_name: ${ANSIBLE_TEST_STACK_NAME}
          EOF

      - name: Set up Python
        uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e  # v2.3.4
        with:
          python-version: "3.10"

      - name: Install ansible-base (${{ matrix.ansible }})
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz --disable-pip-version-check

      - name: Test Modules
        # yamllint disable-line rule:line-length
        run: ansible-test integration -v alert_contact_point alert_notification_policy cloud_api_key cloud_plugin cloud_stack dashboard datasource folder --color --retry-on-error --continue-on-error --diff --python ${{ matrix.python }} --coverage --docker
        working-directory: ./ansible_collections/${{env.NAMESPACE}}/${{env.COLLECTION_NAME}}

      - name: Cooling Period
        run: sleep 3m
